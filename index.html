<!doctype html>
<html lang="uz" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>Raqamli Dunyo</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Runs before first paint: applies the saved (or system) theme and language
      // so there is no theme flash.
      (function () {
        try {
          var theme = localStorage.getItem('rd.theme');
          if (theme !== 'light' && theme !== 'dark') {
            theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          }
          document.documentElement.setAttribute('data-theme', theme);
          var lang = localStorage.getItem('rd.lang');
          if (lang === 'uz' || lang === 'ru' || lang === 'en') document.documentElement.lang = lang;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
